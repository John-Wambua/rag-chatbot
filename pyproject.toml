[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q -ra --strict-markers --strict-config"
markers = [
    "integration: drives a real ChromaDB in tmp_path with a stub embedder",
    "frontend: exercises the static mount at / and the frontend/ wiring",
]
filterwarnings = [
    "default",
    # chromadb/torch drag in a lot of third-party deprecation noise that no
    # change in this repo can fix. app.py's own on_event warning stays visible.
    "ignore::DeprecationWarning:pkg_resources",
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__:DeprecationWarning",
]
