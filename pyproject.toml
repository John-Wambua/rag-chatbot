[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "isort>=9.0.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: drives a real ChromaDB in tmp_path with a stub embedder",
]

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
  | \.venv
  | chroma_db
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = [
    "ai_generator",
    "app",
    "config",
    "document_processor",
    "models",
    "rag_system",
    "search_tools",
    "session_manager",
    "vector_store",
]
skip_gitignore = true
